<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Velora — Trading Terminal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Cpath d='M8 9l8 15 8-15h-3.4L16 19.6 10.4 9H8z' fill='%2300d1a0'/%3E%3C/svg%3E" />
    <!-- Theme before first paint, so neither the splash nor the app flashes
         the wrong background. Mirrors store/theme.ts (zustand persist JSON). -->
    <script>
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("velora-theme") || "{}");
          t = (s && s.state && s.state.theme) || "dark";
          if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        window.__splashStart = performance.now();
      })();
    </script>
    <style>
      /* Boot splash — plain CSS so it paints before any JS. Removed by
         src/lib/splash.ts once the app has mounted and auth has resolved. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #05070a;
        transition: opacity 280ms ease-out;
      }
      html[data-theme="light"] #splash { background: #f6f7fa; }
      #splash[data-state="out"] { opacity: 0; pointer-events: none; }
      #splash .splash-mark {
        position: relative; width: 88px; height: 88px;
        display: flex; align-items: center; justify-content: center;
        animation: splash-in 360ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #splash .splash-plate {
        width: 48px; height: 48px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        background: #0b0e14; border: 1px solid rgba(255, 255, 255, 0.06);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .splash-ring {
        position: absolute; inset: 0;
        animation: splash-spin 1s linear infinite;
      }
      #splash .splash-track { stroke: rgba(128, 140, 160, 0.18); }
      #splash .splash-arc { stroke: #3d7cff; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(61, 124, 255, 0); }
        50% { transform: scale(1.05); box-shadow: 0 0 24px 2px rgba(61, 124, 255, 0.22); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .splash-mark, #splash .splash-plate { animation: none; transition: none; }
        #splash .splash-ring { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <span class="splash-mark">
        <svg class="splash-ring" viewBox="0 0 88 88" aria-hidden="true">
          <circle class="splash-track" cx="44" cy="44" r="42" fill="none" stroke-width="1.5" />
          <circle class="splash-arc" cx="44" cy="44" r="42" fill="none" stroke-width="1.5"
            stroke-linecap="round" stroke-dasharray="66 198" />
        </svg>
        <span class="splash-plate">
          <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 9l8 15 8-15h-3.4L16 19.6 10.4 9H8z" fill="#17c885" />
          </svg>
        </span>
      </span>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading Velora…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
